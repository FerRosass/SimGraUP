<!DOCTYPE html>
<html>
    <style>
        #myCanvas {
            border: blue 2px solid;
            background-color: bisque;
        }
    </style>
    <head>
        <title>Hello world parabolic movement simulator</title>
    </head>
    <body>
        <canvas id="myCanvas"></canvas>
        <script>
            //caanvas setup
            var canvas= document.getElementById("myCanvas");
            var ctx = canvas.getContext("2d");

            canvas.width = window.innerWidth -50; 
            canvas.height = window.innerHeight -50; 
            var minWidth4Sim= 20.0;

            var cScale= Math.min(canvas.with,canvas.height)/minWidth4Sim; 

            var simWidth= canvas.width/cScale;
            var simHeight= canvas.height/cScale;

            //function for coordinate system transformation (coordenadas de simulación a coordenadas de canvas)
            
            function cX(pos)
            {
                return pos.x *cScale; 
            }

            function cY(pos)
            {
                return canvas.height- (pos.y *cScale); 
            }

            var gravity = {x: 0.0, y: -9.81};
            var dt= 1.0/30.0;
            var projectile ={radius: 1.0, pos:{x:1.0, y:1.0}, vel:{x:10.0, y:25.0}}; 

            //graphics engine
            function draw()
            {
                ctx.clearRect(0,0, canvas.width, canvas.height);
                ctx.fillstyle=  "rgb(0,255,0)"; 
                ctx.beginPath();
                ctx.arc(cX(projectile.pos), cY(projectile.pos),cScale*projectile.radius, 0.0, 2.0 * Math.PI);
                ctx.closePath();
                ctx.fill(); 
            }
            //Simulation 
            function simulate()
            {
                projectile.vel.x += gravity.x * dt; 
                projectile.vel.y += gravity.y * dt; 
                projectile.pos.x += projectile.vel.x *dt; 
                projectile.pos.y += projectile.vel.y *dt; 

                if (projectile.pos.x > simWidth) {
                    projectile.pos.x = simWidth;
                    projectile.vel.x = -projectile.damp * projectile.vel.x;
                }
                if (projectile.pos.y < 0.0) {
                    projectile.pos.y = 0.0;
                    projectile.vel.y = -projectile.vel.y;
                }
                if (projectile.pos.x < 0.0) {
                    projectile.pos.x = 0.0;
                    projectile.vel.x = -projectile.damp * projectile.vel.x;
                }
            }

            function update()
            {
                simulate();
                draw();
                requestAnimationFrame(update);
            }

            update(); 
        </script>
    </body>
</html>
